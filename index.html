<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Psique Rastreios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna estreita, tipo caderno clínico; cartões só onde há ação. */
:root{
  --bg:#F6F2E9;        /* creme */
  --surface:#FFFDF8;
  --line:#E4DCCB;
  --ink:#2F3326;
  --muted:#73766A;
  --olive:#6B7A4B;
  --olive-deep:#4F5B36;
  --olive-soft:#E7EADB;
  --gold:#B08D4F;
  --gold-soft:#F1E6CF;
  --t0:#7F9461; --t1:#C3A257; --t2:#C2875A; --t3:#A85E57;
  --shadow:0 1px 2px rgba(60,55,30,.05),0 8px 24px rgba(60,55,30,.06);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1D16;--surface:#24271E;--line:#363A2C;--ink:#ECE7D8;--muted:#A6A797;
  --olive:#A4B27C;--olive-deep:#C3CF9C;--olive-soft:#2F3427;--gold:#D3B57A;--gold-soft:#3A3324;
  --t0:#9DB07C;--t1:#D7BA73;--t2:#D79F73;--t3:#D08880;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1D16;--surface:#24271E;--line:#363A2C;--ink:#ECE7D8;--muted:#A6A797;
  --olive:#A4B27C;--olive-deep:#C3CF9C;--olive-soft:#2F3427;--gold:#D3B57A;--gold-soft:#3A3324;
  --t0:#9DB07C;--t1:#D7BA73;--t2:#D79F73;--t3:#D08880;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:2.1rem;letter-spacing:.01em}
h2{font-size:1.65rem}
h3{font-size:1.25rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
a{color:var(--olive-deep)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

/* topo */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.brand-name{font-family:var(--display);font-size:1.5rem;font-weight:600;color:var(--olive-deep);letter-spacing:.02em}
.brand-sub{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;margin-top:-4px}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.82rem;color:var(--muted);font-weight:600}
.nav button[aria-current="true"]{background:var(--olive-soft);color:var(--olive-deep)}
@media (max-width:430px){.brand-sub{display:none}.nav button{padding:6px 9px;font-size:.78rem}.brand svg{width:32px;height:32px}}

/* cartão de acesso (inspirado no vídeo) */
.access{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px 22px 22px;text-align:center;position:relative;overflow:hidden}
.access::before{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--gold-soft),transparent 70%);opacity:.8;pointer-events:none}
.access h1{font-size:2.2rem;color:var(--olive-deep)}
.access .tag{font-family:var(--display);font-style:italic;font-size:1.1rem;color:var(--gold);margin-top:2px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:18px 0 14px}
.access .who{display:flex;flex-direction:column;gap:2px;position:relative}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--olive-soft);color:var(--olive-deep)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.line{background:none;border:1px solid var(--line);color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:.95rem;text-decoration:none;transition:transform .15s ease,background .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--olive);color:#FFFDF8}
.btn.primary:hover{background:var(--olive-deep)}
:root[data-theme="dark"] .btn.primary{color:#1B1D16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1B1D16}}
.btn.soft{background:var(--olive-soft);color:var(--olive-deep)}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 160px}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-weight:600;font-size:.88rem;display:inline-flex;gap:6px;align-items:center;align-self:flex-start}

.section-head{display:flex;flex-direction:column;gap:4px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.grid{gap:10px}}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;cursor:pointer;position:relative;min-width:0;transition:border-color .15s ease,transform .15s ease}
.tool:hover{border-color:var(--olive);transform:translateY(-1px)}
.tool[aria-disabled="true"]{cursor:default;opacity:.62}
.tool[aria-disabled="true"]:hover{transform:none;border-color:var(--line)}
.tool .badge-slot{align-self:flex-end;min-height:22px}
.ico{width:54px;height:54px;border-radius:16px;background:var(--olive-soft);display:grid;place-items:center;color:var(--olive-deep)}
.ico svg{width:28px;height:28px}
.tool .name{font-family:var(--display);font-size:1.15rem;font-weight:600;line-height:1.2;color:var(--ink)}
.tool .meta{font-size:.75rem;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--olive-soft)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:.88rem}
.banner .btn{padding:8px 12px;font-size:.85rem}

label.f{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:1rem;font-weight:500;color:var(--ink);width:100%}
.input:focus{outline:2px solid var(--olive);outline-offset:0;border-color:transparent}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--olive);margin-top:1px;flex:none}
.linkbox{display:flex;gap:8px;align-items:stretch}
.linkbox .input{font-size:.82rem;font-family:ui-monospace,Menlo,monospace}

/* questionário */
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--olive);border-radius:4px;transition:width .3s ease}
.q{font-family:var(--display);font-size:1.6rem;font-weight:500;line-height:1.25;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:1rem;transition:border-color .15s ease,background .15s ease}
.opt:hover{border-color:var(--olive)}
.opt .r{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--olive);background:var(--olive-soft)}
.opt[aria-pressed="true"] .r{border-color:var(--olive)}
.opt[aria-pressed="true"] .r::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--olive)}

/* relatório */
.report{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:20px}
.rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--display);font-size:3.4rem;line-height:1;font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.level{font-family:var(--display);font-size:1.5rem;font-weight:600}
.scale-bar{position:relative;padding-top:16px}
.scale-bar .seg{display:flex;gap:3px;height:10px}
.scale-bar .seg span{border-radius:3px}
.scale-bar .mk{position:absolute;top:0;width:2px;height:28px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
.scale-bar .lbls{display:flex;gap:3px;margin-top:6px;font-size:.7rem;color:var(--muted)}
.scale-bar .lbls span{text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim{display:flex;flex-direction:column;gap:6px}
.dim .top{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600}
.dim .bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.dim .bar i{display:block;height:100%;border-radius:6px}
.alert{border-radius:14px;padding:14px 16px;background:color-mix(in srgb,var(--t3) 14%,transparent);border:1px solid color-mix(in srgb,var(--t3) 45%,transparent);font-size:.9rem}
.alert strong{color:var(--t3)}
.edu{display:flex;flex-direction:column;gap:8px}
.edu ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.answers{width:100%;border-collapse:collapse;font-size:.84rem}
.answers td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.answers td:first-child{color:var(--muted);width:28px;font-variant-numeric:tabular-nums}
.answers td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:10px}
details summary{cursor:pointer;font-weight:600;color:var(--olive-deep)}
.disclaimer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.sign{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:24px;font-size:.85rem}
.sign::before{content:"";width:200px;height:1px;background:var(--ink);opacity:.4;margin-bottom:6px}

.center{text-align:center;align-items:center}
.leaf-art{color:var(--olive);opacity:.9}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;z-index:20;box-shadow:var(--shadow)}
.foot{text-align:center;font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#222;padding:0}
  .no-print,.topbar,.toast{display:none!important}
  .report{border:0;padding:0}
  .wrap{max-width:none}
}
</style>
<!-- ARTIFACT-HEAD-END -->
</head>
<body>
<!-- ARTIFACT-BODY-START -->
<div class="wrap" id="app" aria-live="polite"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== Utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem('psique:'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('psique:'+k, JSON.stringify(v)); } catch(e){} }
};
const enc = o => { const b = new TextEncoder().encode(JSON.stringify(o)); let s=''; b.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const dec = t => { try { const s = atob(t.replace(/-/g,'+').replace(/_/g,'/')); const b = Uint8Array.from(s, c => c.charCodeAt(0)); return JSON.parse(new TextDecoder().decode(b)); } catch(e){ return null; } };
const digits = s => { let d = String(s||'').replace(/\D/g,''); if (d && d.length <= 11) d = '55' + d; return d; };
const fmtDate = t => new Date(t).toLocaleDateString('pt-BR', {day:'2-digit', month:'short', year:'numeric'});
const baseUrl = () => location.origin + location.pathname;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); }
function copy(text, inputSel){
  const fallback = () => { const i = inputSel && $(inputSel); if (i){ i.focus(); i.select(); } toast('Selecione e copie o link'); };
  try { navigator.clipboard.writeText(text).then(() => toast('Link copiado'), fallback); } catch(e){ fallback(); }
}

/* ===================== Ícones ===================== */
const ICONS = {
  rain:'<path d="M7 15a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 8a3.5 3.5 0 0 1 0 7H7Z"/><path d="M9 18l-1 2M13 18l-1 2M17 18l-1 2"/>',
  wave:'<path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>',
  flame:'<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-8.5Z"/>',
  focus:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/>',
  puzzle:'<path d="M5 8h3a2 2 0 1 1 4 0h3v3a2 2 0 1 1 0 4v3h-3a2 2 0 1 0-4 0H5v-3a2 2 0 1 0 0-4V8Z"/>',
  moon:'<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5Z"/>',
  heart:'<path d="M12 19s-7-4.4-7-9.5A3.8 3.8 0 0 1 12 7a3.8 3.8 0 0 1 7 2.5C19 14.6 12 19 12 19Z"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  wa:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7L4 20Z"/>',
};
const icon = (n, size) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${size?`width="${size}" height="${size}"`:''} aria-hidden="true">${ICONS[n]}</svg>`;
const LOGO = `<svg width="38" height="38" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <circle cx="24" cy="24" r="22.5" stroke="var(--olive)" stroke-opacity=".35"/>
  <g stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 11v26"/>
    <path d="M14.5 15.5v4.5a9.5 9.5 0 0 0 19 0v-4.5"/>
    <path d="M19 37h10"/>
  </g>
</svg>`;

/* ===================== Instrumentos ===================== */
const FREQ4 = ['Nenhuma vez','Vários dias','Mais da metade dos dias','Quase todos os dias'];
const FREQ5 = ['Nunca','Raramente','Algumas vezes','Frequentemente','Muito frequentemente'];
const FREQ5B = ['Nunca','Raramente','Às vezes','Frequentemente','Sempre'];

const SCALES = {
  phq9: {
    title:'Rastreio de Sintomas Depressivos', code:'PHQ-9', area:'Humor', icon:'rain', minutes:3, kind:'validado', badge:'',
    about:'Nove perguntas sobre humor, interesse, sono, energia e autoavaliação nas últimas duas semanas. Útil para triagem inicial e para acompanhar a evolução ao longo do tratamento.',
    period:'Nas últimas 2 semanas, com que frequência você foi incomodado(a) por:',
    options:FREQ4,
    items:[
      'Pouco interesse ou pouco prazer em fazer as coisas',
      'Se sentir para baixo, deprimido(a) ou sem perspectiva',
      'Dificuldade para pegar no sono ou permanecer dormindo, ou dormir mais do que de costume',
      'Se sentir cansado(a) ou com pouca energia',
      'Falta de apetite ou comer demais',
      'Se sentir mal consigo mesmo(a), achar que é um fracasso ou que decepcionou sua família ou a si mesmo(a)',
      'Dificuldade para se concentrar nas coisas, como ler ou assistir televisão',
      'Lentidão para se movimentar ou falar, a ponto de outras pessoas perceberem; ou o oposto: estar tão agitado(a) que fica andando de um lado para o outro mais do que de costume',
      'Pensar em se ferir de alguma maneira ou que seria melhor estar morto(a)'
    ],
    levels:[
      {max:4, label:'Sintomas mínimos', tone:0, text:'As respostas indicam poucos sinais de humor deprimido neste período. Oscilações de ânimo fazem parte da vida e não significam, por si só, um problema.', care:['Manter rotinas que já fazem bem: sono regular, movimento e contato com pessoas queridas.','Observar se algo muda nas próximas semanas.']},
      {max:9, label:'Sintomas leves', tone:1, text:'Há alguns sinais de desânimo, cansaço ou perda de interesse. É um bom momento para olhar com cuidado para o que tem pesado na rotina.', care:['Reservar pequenos momentos de prazer no dia, mesmo que curtos.','Conversar sobre esses sinais na psicoterapia.','Cuidar do sono e da alimentação.']},
      {max:14, label:'Sintomas moderados', tone:2, text:'Os sinais aparecem com frequência e podem estar afetando o trabalho, as relações ou o autocuidado. Vale aprofundar a avaliação com o(a) profissional.', care:['Acompanhamento psicológico regular.','Avaliar junto ao(à) profissional a necessidade de avaliação médica.','Evitar se isolar: manter ao menos um contato de confiança por perto.']},
      {max:19, label:'Sintomas moderadamente graves', tone:3, text:'Os sinais estão presentes na maior parte dos dias e merecem atenção próxima. Você não precisa lidar com isso sozinho(a).', care:['Acompanhamento psicológico próximo e avaliação psiquiátrica.','Combinar com o(a) profissional um plano de cuidado e de contatos de apoio.']},
      {max:27, label:'Sintomas graves', tone:3, text:'Os sinais estão intensos e frequentes. É importante buscar cuidado especializado o quanto antes.', care:['Avaliação psiquiátrica e psicológica com prioridade.','Rede de apoio próxima e plano de segurança construído com o(a) profissional.']}
    ],
    flags:a => a[8] > 0 ? [{risk:true, pro:'Resposta positiva ao item 9 (pensamentos de morte ou de autolesão). Recomenda-se avaliação de risco o quanto antes.', patient:true}] : [],
    ref:'Kroenke, Spitzer & Williams (2001). Versão brasileira validada por Santos et al. (2013). Instrumento de uso livre.'
  },
  gad7: {
    title:'Rastreio de Ansiedade', code:'GAD-7', area:'Ansiedade', icon:'wave', minutes:2, kind:'validado', badge:'',
    about:'Sete perguntas sobre preocupação, tensão e inquietação nas últimas duas semanas. Rastreia sintomas de ansiedade generalizada.',
    period:'Nas últimas 2 semanas, com que frequência você foi incomodado(a) por:',
    options:FREQ4,
    items:[
      'Sentir-se nervoso(a), ansioso(a) ou muito tenso(a)',
      'Não ser capaz de impedir ou de controlar as preocupações',
      'Preocupar-se muito com diversas coisas',
      'Dificuldade para relaxar',
      'Ficar tão agitado(a) que se torna difícil permanecer sentado(a)',
      'Ficar facilmente aborrecido(a) ou irritado(a)',
      'Sentir medo, como se algo horrível fosse acontecer'

function compute(id, a){
  const s = SCALES[id];
  const base = s.score ? s.score(a) : {total:a.reduce((x,y) => x+y, 0), max:s.items.length*(s.options.length-1), unit:'pontos'};
  const level = s.levels.find(l => base.total <= l.max) || s.levels[s.levels.length-1];
  const dims = s.dims ? s.dims.map(d => { const v = d.items.reduce((x,i) => x + a[i], 0), m = d.items.length*(s.options.length-1); return {name:d.name, v, m}; }) : null;
  const flags = s.flags ? s.flags(a) : [];
  return {...base, level, dims, flags};
}

  const url = baseUrl() + '?r=' + enc(res);
  const msg = `Olá, ${patient.n || ''}! Respondi o questionário "${s.title}". Minhas respostas:\n${url}`;
  const risk = c.flags.some(f => f.patient);
  return `<section class="access">
    <div style="display:flex;justify-content:center;margin-bottom:6px">${LOGO.replace('width="38" height="38"','width="52" height="52"')}</div>
    <h1>Respostas concluídas</h1>
    <div class="rule"></div>
    <div class="stack" style="text-align:left;position:relative">
      <p>Falta só um passo: toque no botão abaixo para enviar suas respostas para ${esc(patient.n || 'seu(sua) profissional')}.</p>
      <a class="btn primary block" href="https://wa.me/${digits(patient.w)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${icon('wa',18)} Enviar minhas respostas</a>
      <div class="linkbox"><input class="input" id="rlnk" readonly value="${esc(url)}"><button class="btn soft" data-copy="${esc(url)}">Copiar</button></div>
      <p class="small muted">Se o WhatsApp não abrir, copie o link acima e envie para seu(sua) profissional.</p>
    </div>
  </section>
  ${risk ? `<div class="alert">Percebemos que você tem tido pensamentos difíceis. Você não precisa passar por isso sozinho(a). Converse com ${esc(patient.n || 'seu(sua) profissional')} assim que puder. Se precisar de ajuda agora, ligue <strong>188</strong> (CVV, gratuito e 24h) ou <strong>192</strong> (SAMU).</div>` : ''}
  ${patient.v ? `<section class="card stack"><p class="eyebrow">Uma primeira devolutiva</p><h3 style="color:${toneVar(c.level.tone)}">${c.level.label}</h3><p>${c.level.text}</p><ul style="margin:0;padding-left:20px">${c.level.care.map(x => `<li>${x}</li>`).join('')}</ul><p class="small muted">Esta é uma orientação inicial. A interpretação completa será feita com seu(sua) profissional.</p></section>` : ''}
  ${patient.sim ? `<button class="btn ghost block no-print" id="seeAsPro">Demonstração: abrir o relatório como profissional</button>` : ''}`;
}

/* ===================== Render ===================== */
function render(){
  const app = $('#app');
  const v = S.view;
  app.innerHTML =
    v === 'home' ? viewHome() :
    v === 'results' ? viewResults() :
    v === 'tool' ? viewTool() :
    v === 'profile' ? viewProfile() :
    v === 'report' ? viewReport() :
    v === 'pIntro' ? viewPatientIntro() :
    v === 'pQ' ? viewQuestion() :
    v === 'pDone' ? viewPatientDone() : viewHome();
  bind();
}

function startPatient(ctx){ patient = {...ctx, a:Array(SCALES[ctx.s].items.length).fill(null), t:Date.now()}; go('pIntro'); }

function bind(){
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll('[data-tool]').forEach(b => {
    const open = () => go('tool', {id:b.dataset.tool});
    b.onclick = open; b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } };
  });
  document.querySelectorAll('[data-result]').forEach(b => b.onclick = () => go('report', {r:results.find(r => r.id === b.dataset.result)}));
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy, b.previousElementSibling && '#' + b.previousElementSibling.id));

  const mk = $('#mklink');
  if (mk) {
    const ctxNow = () => ({s:S.id, p:($('#pname').value || '').trim(), n:pro.name, c:pro.crp, w:pro.wa, v:$('#showres').checked});
    mk.onclick = () => {
      const ctx = ctxNow();
      if (!ctx.p) { $('#pname').focus(); toast('Digite o nome do paciente'); return; }
      $('#linkout').innerHTML = linkOut(ctx); bind();
    };
    $('#applynow').onclick = () => { const ctx = ctxNow(); startPatient({...ctx, p:ctx.p || 'Paciente', sim:true, local:true}); };
  }
  const sim = $('#simulate'); if (sim) sim.onclick = () => startPatient({s:S.id, p:($('#pname').value||'').trim(), n:pro.name, c:pro.crp, w:pro.wa, v:$('#showres').checked, sim:true});

  const st = $('#start'); if (st) st.onclick = () => go('pQ', {i:0});
  document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    patient.a[S.i] = +b.dataset.opt; render();
    setTimeout(() => { const n = SCALES[patient.s].items.length; if (S.i < n-1) go('pQ', {i:S.i+1}); else go('pDone'); }, 220);
  });
  const qb = $('#qback'); if (qb) qb.onclick = () => S.i === 0 ? go('pIntro') : go('pQ', {i:S.i-1});

  const sp = $('#seeAsPro');
  if (sp) sp.onclick = () => {
    const r = {id:'r'+Date.now(), s:patient.s, p:patient.p || 'Paciente', a:patient.a, t:patient.t};
    results.push(r); saveResults(); patient = null; go('report', {r});
  };

  const pdf = $('#pdf'); if (pdf) pdf.onclick = () => { try { window.print(); } catch(e){} };

  const pf = $('#pf');
  if (pf) pf.onsubmit = e => {
    e.preventDefault();
    pro = {name:$('#f-name').value.trim(), crp:$('#f-crp').value.trim(), wa:$('#f-wa').value.trim(), email:$('#f-email').value.trim()};
    store.set('pro', pro); toast('Perfil salvo'); go('home');
  };
  const lo = $('#logout');
  if (lo) lo.onclick = () => { try { localStorage.removeItem('psique:pro'); localStorage.removeItem('psique:results'); } catch(e){} pro = DEMO_PRO; results = EXAMPLES; toast('Dados apagados'); go('home'); };
}

/* ===================== Entrada por link ===================== */
(function boot(){
  let q; try { q = new URLSearchParams(location.search); } catch(e){ q = new URLSearchParams(''); }
  const a = q.get('a'), r = q.get('r');
  if (a) { const ctx = dec(a); if (ctx && SCALES[ctx.s]) { startPatient(ctx); return; } }
  if (r) {
    const res = dec(r);
    if (res && SCALES[res.s] && Array.isArray(res.a)) {
      const key = res.s + res.t + res.p;
      let saved = results.find(x => x.key === key);
      if (!saved) { saved = {...res, id:'r'+Date.now(), key}; results.push(saved); saveResults(); }
      try { history.replaceState(null, '', location.pathname); } catch(e){}
      go('report', {r:saved}); return;
    }
  }
  render();
})();
</script>
<!-- ARTIFACT-BODY-END -->
</body>
